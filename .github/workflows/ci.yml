name: CI

on:
  workflow_dispatch: {}

concurrency:
  group: py2dadroid-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  validate-workflows:
    name: Validate workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  build:
    name: Build (standard / arm64-v8a)
    needs: validate-workflows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [standard]
        abi: [arm64-v8a]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Resolve verified CPython runtime
        run: |
          bash scripts/fetch_embeddable_python.sh             --variant "${{ matrix.variant }}"             --abi "${{ matrix.abi }}"             --out build/python-runtime

      - name: Assemble
        run: |
          ./gradlew assembleDebug             -PpyVersion=3.14             -PpyVariant="${{ matrix.variant }}"             -PabiFilter="${{ matrix.abi }}"             -PpyRuntimeRoot="$GITHUB_WORKSPACE/build/python-runtime/prefix"             --stacktrace

      - name: JVM tests
        run: |
          ./gradlew test             -PpyVersion=3.14             -PpyVariant="${{ matrix.variant }}"             -PabiFilter="${{ matrix.abi }}"             -PpyRuntimeRoot="$GITHUB_WORKSPACE/build/python-runtime/prefix"             --stacktrace
